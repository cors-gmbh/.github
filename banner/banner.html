<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Figtree;font-weight:400 800;src:url(fonts/Figtree-400-latin.woff2) format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:400px;overflow:hidden;background:#161616}
.b{position:relative;width:1280px;height:400px;font-family:Figtree,sans-serif;color:#fff;overflow:hidden;
  background:radial-gradient(ellipse 60% 90% at 78% 70%,rgba(205,21,26,.28),transparent 70%),linear-gradient(180deg,#1B1B1B,#141414)}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:40px 40px;
  mask-image:linear-gradient(90deg,transparent 0%,#000 45%,#000 100%)}
.txt{position:absolute;left:72px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;z-index:2}
.logo{height:30px;width:auto;margin-bottom:34px;align-self:flex-start}
h1{font-size:60px;font-weight:500;letter-spacing:-.02em;line-height:1.04}
h1 span{color:#FF2D35}
.tag{margin-top:22px;font:500 14px/1 Figtree;letter-spacing:.14em;text-transform:uppercase;color:#8C929A}
.tag i{font-style:normal;color:#FF2D35;margin:0 10px}
.scene{position:absolute;right:110px;top:-78px;width:520px;height:520px;perspective:1600px}
.stack{position:absolute;left:50%;top:50%;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-42deg)}
.s{position:absolute;width:220px;height:220px;left:-110px;top:-110px;border-radius:10px;
  background:#191A1C;border:1.5px solid #3A3E44;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.s::before{content:"";position:absolute;inset:18px;border-radius:5px;border:1px dashed rgba(255,255,255,.08)}
.s.core{background:#CD151A;border-color:#FF2D35;box-shadow:0 0 60px 10px rgba(255,45,53,.55),0 0 140px 40px rgba(205,21,26,.35)}
.s.core::before{border-color:rgba(255,213,214,.35)}
.beam{position:absolute;left:-1px;top:0;width:2px;height:330px;background:linear-gradient(#FF2D35,rgba(255,45,53,.0));transform-origin:top;transform:rotateX(-90deg)}
.pins{position:absolute;inset:0}
</style></head><body>
<div class="b">
  <div class="grid"></div>
  <div class="txt">
    <img class="logo" src="logo.png" alt="">
    <h1>One system.<br>Down to the <span>Core.</span></h1>
    <div class="tag">Pimcore<i>/</i>CoreShop<i>/</i>Symfony</div>
  </div>
  <div class="scene"><div class="stack" id="st"></div></div>
</div>
<script>
const st=document.getElementById('st');
const n=6,gap=30;
for(let i=0;i<n;i++){
  const d=document.createElement('div');
  d.className='s'+(i===n-1?' core':'');
  const z=( (n-1)/2 - i)*gap;
  d.style.transform=`translateZ(${z}px)`;
  if(i<n-1){const l=24+i*3;d.style.background=`rgb(${l},${l+1},${l+3})`;}
  st.appendChild(d);
}
</script>
</body></html>
